# Production overrides (Phase 41). Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Only Caddy is exposed publicly (80/443); it terminates TLS and reverse-proxies
# same-origin to the frontend and backend. Requires a root .env with (at least)
# APP_PASSWORD, FERNET_KEY, and the live Kite/AI settings.

services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "https://finance.rahulnainala.com"
    restart: unless-stopped

  backend:
    restart: unless-stopped
    environment:
      FRONTEND_ORIGIN: "https://finance.rahulnainala.com"

  postgres:
    restart: unless-stopped

  risk-engine:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
