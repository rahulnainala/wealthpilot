apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: wealthpilot
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: wealthpilot/frontend:latest
          env:
            - { name: NEXT_PUBLIC_API_BASE_URL, value: "https://api.wealthpilot.example.com" }
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: wealthpilot
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
