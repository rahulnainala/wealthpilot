apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: wealthpilot
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: wealthpilot
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: wealthpilot }
            - { name: POSTGRES_PASSWORD, value: wealthpilot }
            - { name: POSTGRES_DB, value: wealthpilot }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "wealthpilot"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: wealthpilot
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
