apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: wealthpilot
spec:
  replicas: 2
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      containers:
        - name: backend
          image: wealthpilot/backend:latest
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: wealthpilot
spec:
  selector: { app: backend }
  ports:
    - port: 8000
      targetPort: 8000
